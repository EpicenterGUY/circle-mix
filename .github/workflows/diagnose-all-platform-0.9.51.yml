name: Diagnose all-platform 0.9.51

on:
  push:
    branches:
      - release/all-platform-0.9.51
    paths:
      - .github/workflows/diagnose-all-platform-0.9.51.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-platform-0.9.51
      - name: Capture corrected preparation run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-all-platform-0.9.51-v2.yml/runs?branch=release%2Fall-platform-0.9.51&per_page=10")
          run=$(echo "$runs" | jq -c '.workflow_runs[0] // {}')
          run_id=$(echo "$run" | jq -r '.id // empty')
          echo "$run" | jq . > .github/diagnostics/all-platform-0.9.51-v2-run.json
          if [ -n "$run_id" ]; then gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > .github/diagnostics/all-platform-0.9.51-v2-jobs.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/diagnostics/all-platform-0.9.51-v2-*.json
          git commit -m "chore: record corrected 0.9.51 preparation status"
          git push origin HEAD:release/all-platform-0.9.51
