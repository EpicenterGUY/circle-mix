name: Snapshot Android 0.9.50 release run

on:
  push:
    branches: [release/android-0.9.50]
    paths: [.github/workflows/android-release-snapshot-0.9.50.yml]

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: EpicenterGUY/circle-mix
      MERGE_SHA: 210a7d0f052a9e70aad02163f944ae5bd1814a3b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/android-0.9.50
      - name: Write current release status
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$REPO" --workflow android-release.yml --branch main --limit 10 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt)"
          run="$(jq -c --arg sha "$MERGE_SHA" '[.[] | select(.headSha==$sha)][0] // null' <<<"$runs")"
          release='null'
          if gh release view android-v0.9.50 --repo "$REPO" --json tagName,name,isDraft,isPrerelease,url,targetCommitish,assets > /tmp/release.json 2>/tmp/release-error.txt; then release="$(cat /tmp/release.json)"; fi
          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --argjson run "$run" --argjson release "$release" --rawfile releaseError /tmp/release-error.txt '{checkedAt:$checkedAt,run:$run,release:$release,releaseError:$releaseError}' > android-release-snapshot-0.9.50.json
          cat android-release-snapshot-0.9.50.json
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-release-snapshot-0.9.50.json
          git commit -m "chore: snapshot Android 0.9.50 release status"
          git push origin HEAD:release/android-0.9.50
