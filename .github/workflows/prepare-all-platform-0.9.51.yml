name: Prepare all-platform 0.9.51

on:
  push:
    branches:
      - release/all-platform-0.9.51
    paths:
      - .github/workflows/prepare-all-platform-0.9.51.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-platform-0.9.51
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply 0.9.51 release metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,re

          VERSION='0.9.51'
          OLD='0.9.50'
          CODE=9051
          root=Path('.')

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path,text): (root/path).write_text(text,encoding='utf-8')
          def replace_required(path,old,new):
            text=read(path)
            if old not in text: raise SystemExit(f'{path}: missing {old!r}')
            write(path,text.replace(old,new))

          package=json.loads(read('package.json'))
          package['version']=VERSION
          package['scripts']['test']=package['scripts']['test'].replace('prepare-android-0.9.50.js','prepare-android-0.9.51.js')
          package['scripts']['android:prepare']=package['scripts']['android:prepare'].replace('prepare-android-0.9.50.js','prepare-android-0.9.51.js')
          write('package.json',json.dumps(package,ensure_ascii=False,indent=2)+'\n')

          lock=json.loads(read('package-lock.json'))
          lock['version']=VERSION
          lock['packages']['']['version']=VERSION
          write('package-lock.json',json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          desktop=json.loads(read('src-tauri/tauri.conf.json'))
          desktop['version']=VERSION
          write('src-tauri/tauri.conf.json',json.dumps(desktop,ensure_ascii=False,indent=2)+'\n')

          android=json.loads(read('src-tauri/tauri.android.conf.json'))
          android['version']=VERSION
          android['bundle']['android']['versionCode']=CODE
          write('src-tauri/tauri.android.conf.json',json.dumps(android,ensure_ascii=False,indent=2)+'\n')

          cargo=read('src-tauri/Cargo.toml')
          cargo,count=re.subn(r'(?m)^version = "0\.9\.50"$',f'version = "{VERSION}"',cargo,count=1)
          if count!=1: raise SystemExit('Cargo.toml package version marker missing')
          write('src-tauri/Cargo.toml',cargo)

          cargo_lock=read('src-tauri/Cargo.lock')
          pattern=r'(name = "circle-mix"\nversion = ")0\.9\.50(")'
          cargo_lock,count=re.subn(pattern,rf'\g<1>{VERSION}\g<2>',cargo_lock,count=1)
          if count!=1: raise SystemExit('Cargo.lock circle-mix version marker missing')
          write('src-tauri/Cargo.lock',cargo_lock)

          old_script=root/'scripts/prepare-android-0.9.50.js'
          new_script=root/'scripts/prepare-android-0.9.51.js'
          if not old_script.exists(): raise SystemExit('Android 0.9.50 release pass missing')
          new_script.write_text(r'''#!/usr/bin/env node
          'use strict';
          const fs=require('fs');
          const path=require('path');
          const root=path.resolve(__dirname,'..');
          const out=path.join(root,'android-dist');
          const VERSION='0.9.51';
          const BUILD_DATE='2026-07-31';
          if(!fs.existsSync(path.join(out,'index.html')))throw new Error('android-dist must be prepared before the 0.9.51 release pass');
          const sourceCss=path.join(root,'song-select-fixes.css');
          const targetCss=path.join(out,'song-select-fixes.css');
          if(!fs.existsSync(sourceCss))throw new Error('song-select-fixes.css is missing');
          fs.copyFileSync(sourceCss,targetCss);
          const release=`(function(){
            "use strict";
            const release={version:"${VERSION}",date:"${BUILD_DATE}",title:"ANDROID 0.9.51",summary:"채보 난이도를 선택하면 정확도별 예상 POWER를 바로 확인할 수 있는 업데이트입니다.",changes:[
              {category:"POWER FORECAST",text:"선택한 채보의 90%·95%·97%·99%·100% 정확도 예상 POWER를 곡 선택 화면에 표시합니다."},
              {category:"CONDITION",text:"예상치는 FC·MISS 0 기준이며 실제 결과 POWER와 완전히 같은 산식을 사용합니다."},
              {category:"DIFFICULTY",text:"난이도를 변경하면 해당 채보의 자동 계산 별 난이도에 맞춰 POWER 표가 즉시 갱신됩니다."},
              {category:"COMPATIBILITY",text:"기존 LOCAL 곡·채보·기록과 설정을 유지하며 0.9.50 위에 서명된 업데이트로 설치할 수 있습니다."}
            ]};
            window.CircleMixVersion=Object.freeze({version:release.version,buildDate:release.date});
            const previous=Array.isArray(window.CircleMixChangelog)?window.CircleMixChangelog:[];
            window.CircleMixChangelog=[release,...previous.filter(entry=>entry?.version!==release.version)];
          })();
          `;
          fs.writeFileSync(path.join(out,'src/android-release.js'),release);
          const bootstrap=fs.readFileSync(path.join(out,'src/build-config.js'),'utf8');
          if(!bootstrap.includes('song-select-fixes.css'))throw new Error('Android 0.9.51 payload is missing song-select-fixes.css');
          for(const [file,needle] of [
            ['src/power.js','previewForStars'],
            ['src/game.js','powerPreviewHtml'],
            ['src/game.js','FC · MISS 0 기준'],
            ['src/song-record.js','sortDifficultyEntriesByStars'],
            ['src/editor-playtest.js','mergeLocalDifficulty']
          ]){
            const source=fs.readFileSync(path.join(out,file),'utf8');
            if(!source.includes(needle))throw new Error(`Android 0.9.51 payload is missing ${needle} in ${file}`);
          }
          console.log(`Applied Android ${VERSION} accuracy POWER forecast release pass.`);
          '''.replace('          ',''),encoding='utf-8')
          old_script.unlink()

          replace_required('scripts/audit-android-dist.js','version:"0.9.50"','version:"0.9.51"')
          replace_required('scripts/audit-android-dist.js','ANDROID 0.9.50','ANDROID 0.9.51')
          text=read('scripts/audit-android-dist.js')
          text=text.replace("'자동 계산 별 기준','다른 난이도와 채보를 그대로 보존'","'90%·95%·97%·99%·100%','FC·MISS 0 기준'")
          write('scripts/audit-android-dist.js',text)

          tests=read('tests/android-app.test.js')
          tests=tests.replace('0.9.50','0.9.51').replace('9050','9051')
          tests=tests.replace('android-v0.9.51','android-v0.9.52').replace("'0.9.51'","'0.9.52'",1)
          tests=tests.replace('circle-mix-0.9.51-android-arm64-release.apk','circle-mix-0.9.52-android-arm64-release.apk')
          tests=tests.replace('/android-v0.9.51/','/android-v0.9.52/')
          tests=tests.replace("releaseToUpdate(release,'0.9.51')","releaseToUpdate(release,'0.9.51')")
          tests=tests.replace('prepare-android-0.9.50.js','prepare-android-0.9.51.js')
          tests=tests.replace("/VERSION='0\\.9\\.50'/","/VERSION='0\\.9\\.51'/")
          tests=tests.replace('/ANDROID 0\\.9\\.50/','/ANDROID 0\\.9\\.51/')
          tests=tests.replace('/version:"0\\.9\\.50"/','/version:"0\\.9\\.51"/')
          tests=tests.replace('/prepare-android-0\\.9\\.50\\.js/','/prepare-android-0\\.9\\.51\\.js/')
          write('tests/android-app.test.js',tests)

          for file in ['tests/desktop-installer.test.js','tests/desktop-updater.test.js']:
            write(file,read(file).replace('0.9.50','0.9.51').replace('0\\.9\\.50','0\\.9\\.51'))

          desktop_pass=read('scripts/pc-settings-desktop-pass.js')
          desktop_pass=re.sub(r"\.replace\(/summary:\"\[\^\"\]\+\"/,'.*?'\)",".replace(/summary:\"[^\"]+\"/,'summary:\"채보 난이도별 정확도 POWER 예상표를 추가한 Windows 업데이트입니다.\"')",desktop_pass,count=1)
          old_changes=re.search(r"  \.replace\(/changes:\\\[\[\\s\\S\]\*\?\\]\\};/,`changes:\[[\s\S]*?\n  \]\};`\);",desktop_pass)
          if not old_changes: raise SystemExit('desktop release changes block missing')
          new_changes='''  .replace(/changes:\[[\s\S]*?\]\};/,`changes:[
              {category:"POWER FORECAST",text:"선택한 채보의 90%·95%·97%·99%·100% 정확도 예상 POWER를 곡 선택 화면에 표시합니다."},
              {category:"CONDITION",text:"예상치는 FC·MISS 0 기준이며 실제 결과 POWER와 같은 공용 산식을 사용합니다."},
              {category:"DIFFICULTY",text:"난이도를 바꾸면 자동 계산 별 난이도에 맞춰 예상 POWER가 즉시 갱신됩니다."},
              {category:"COMPATIBILITY",text:"판정, 기록, 기존 LOCAL .cmix와 Windows 설정은 그대로 유지됩니다."}
            ]};`);'''
          desktop_pass=desktop_pass[:old_changes.start()]+new_changes+desktop_pass[old_changes.end():]
          desktop_pass=desktop_pass.replace('Applied unified settings, LOCAL difficulty and editor playtest desktop pass','Applied unified settings and accuracy POWER forecast desktop pass')
          write('scripts/pc-settings-desktop-pass.js',desktop_pass)

          desktop_audit=read('scripts/audit-desktop-dist.js')
          desktop_audit=desktop_audit.replace("||!desktopRelease.includes('자동 계산 별 기준')||!desktopRelease.includes('다른 난이도와 채보를 그대로 보존')","||!desktopRelease.includes('90%·95%·97%·99%·100%')||!desktopRelease.includes('FC·MISS 0 기준')")
          desktop_audit=desktop_audit.replace('difficulty and editor release metadata','accuracy POWER forecast release metadata')
          write('scripts/audit-desktop-dist.js',desktop_audit)

          installer=read('tests/desktop-installer.test.js')
          installer=installer.replace("assert.match(settingsPass,/자동 계산 별 기준/,'desktop changelog must describe runtime-star ordering');","assert.match(settingsPass,/90%·95%·97%·99%·100%/,'desktop changelog must list accuracy POWER targets');")
          installer=installer.replace("assert.match(settingsPass,/다른 난이도와 채보를 그대로 보존/,'desktop changelog must describe sibling difficulty preservation');","assert.match(settingsPass,/FC·MISS 0 기준/,'desktop changelog must state the forecast assumptions');")
          installer=installer.replace('runtime-star ordering and editor safety release','accuracy POWER forecast release')
          write('tests/desktop-installer.test.js',installer)
          PY
      - run: npm ci
      - name: Run repository and distribution tests
        run: |
          npm test
          npm run desktop:prepare
          npm run desktop:audit
          npm run android:prepare
          node scripts/audit-android-dist.js
      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: prepare Android and Windows 0.9.51 POWER forecast"
          git push origin HEAD:release/all-platform-0.9.51
