name: Patch difficulty display release

on:
  push:
    branches:
      - agent/fix-unlimited-difficulty-display
    paths:
      - .github/workflows/patch-difficulty-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-unlimited-difficulty-display
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply difficulty display and release patch
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root=Path('.')
          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path,text): (root/path).write_text(text,encoding='utf-8')
          def replace_once(text,old,new,label):
              count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old,new,1)

          # Unlimited automatic difficulty scale.
          path=Path('src/chart-difficulty.js')
          text=read(path)
          text=replace_once(text,"const VERSION='local-v5',MAX_STARS=15,TAU=Math.PI*2","const VERSION='local-v6',MAX_STARS=Number.POSITIVE_INFINITY,TAU=Math.PI*2",'difficulty constants')
          text=replace_once(text,"return {stars:Math.round(clamp(scaled,1,MAX_STARS)*10)/10,raw:Math.round(raw*100)/100,version:VERSION,components};","return {stars:Math.round(Math.max(1,scaled)*10)/10,raw:Math.round(raw*100)/100,version:VERSION,components};",'difficulty clamp')
          write(path,text)

          # Keep authored LEVEL visible while AUTO stars remain the calculation source.
          path=Path('src/game.js')
          text=read(path)
          old='''  function getDifficulty(mode=mapMode){
    if(isLocalSong(selectedSong)){ const c=selectedSong.charts?.[mode]; return c ? chartDifficulty.calculate(c) : null; }
'''
          new='''  function declaredDifficultyLevel(songData,difficultyId){
    const meta=songData?.difficulties?.[difficultyId];
    const value=Number(meta?.level??meta?.declaredStars??meta?.stars);
    return Number.isFinite(value)&&value>=1?value:null;
  }
  function getDifficulty(mode=mapMode){
    if(isLocalSong(selectedSong)){
      const c=selectedSong.charts?.[mode];
      if(!c)return null;
      return {...chartDifficulty.calculate(c),declaredLevel:declaredDifficultyLevel(selectedSong,mode)};
    }
'''
          text=replace_once(text,old,new,'local difficulty calculation')
          old='''  function formatStarValue(stars){
    const value=Number(stars);
    return Number.isFinite(value) ? value.toFixed(1)+"★" : "—";
  }
'''
          new='''  function formatStarValue(stars){
    const value=Number(stars);
    return Number.isFinite(value) ? value.toFixed(1)+"★" : "—";
  }
  function formatLevelValue(level){
    const value=Number(level);
    if(!Number.isFinite(value))return "";
    return Number.isInteger(value)?String(value):value.toFixed(1).replace(/\\.0$/,'');
  }
  function formatDifficultyView(diff){
    const auto=formatStarValue(diff?.stars),level=formatLevelValue(diff?.declaredLevel);
    return level?`LV ${level} · AUTO ${auto}`:auto;
  }
'''
          text=replace_once(text,old,new,'difficulty format helpers')
          old='''  function formatDifficulty(mode=mapMode){
    const d=getDifficultySafe(mode);
    return d ? formatStarValue(d.stars) : "—";
  }
'''
          new='''  function formatDifficulty(mode=mapMode){
    const d=getDifficultySafe(mode);
    return d ? formatDifficultyView(d) : "—";
  }
'''
          text=replace_once(text,old,new,'active difficulty display')
          old='''    const chart=songData.charts?.[difficultyId]; let stars;
    if(chart){ try{ stars=chartDifficulty.calculate(chart).stars; }catch(error){ console.error("[Difficulty Calculation Failed]", error); } }
    return {id:difficultyId, label, stars};
'''
          new='''    const chart=songData.charts?.[difficultyId]; let stars;
    if(chart){ try{ stars=chartDifficulty.calculate(chart).stars; }catch(error){ console.error("[Difficulty Calculation Failed]", error); } }
    return {id:difficultyId, label, stars, declaredLevel:declaredDifficultyLevel(songData,difficultyId)};
'''
          text=replace_once(text,old,new,'difficulty view metadata')
          old='''      const diffs=chartEntries.map(({id})=>{ const diff=difficultyViewForSong(songData,id); return `${escapeHtml(diff?.label || id.toUpperCase())} ${escapeHtml(formatStarValue(diff?.stars))}`; }).join(" · ");'''
          new='''      const diffs=chartEntries.map(({id})=>{ const diff=difficultyViewForSong(songData,id); return `${escapeHtml(diff?.label || id.toUpperCase())} ${escapeHtml(formatDifficultyView(diff))}`; }).join(" · ");'''
          text=replace_once(text,old,new,'song card difficulty display')
          text=replace_once(text,'        const stars = formatStarValue(diff?.stars);','        const stars = formatDifficultyView(diff);','difficulty button display')
          write(path,text)

          # Difficulty estimator regression updates.
          path=Path('tests/chart-difficulty.test.js')
          text=read(path)
          text=replace_once(text,"assert.equal(D.VERSION,'local-v5');assert.equal(D.MAX_STARS,15);","assert.equal(D.VERSION,'local-v6');assert.equal(D.MAX_STARS,Infinity);",'difficulty test version')
          old="test('upper scale extends beyond ten stars without exceeding the display cap',()=>{const stars=S(upperFixture());assert.ok(stars>11,`upper fixture ${stars}`);assert.ok(stars<=D.MAX_STARS,`${stars} <= ${D.MAX_STARS}`);});"
          new="test('upper scale extends beyond ten stars without a hard display cap',()=>{const stars=S(upperFixture());assert.ok(stars>11,`upper fixture ${stars}`);assert.ok(D.displayScale(20)>15,`20 raw -> ${D.displayScale(20)}`);assert.equal(D.MAX_STARS,Infinity);});"
          text=replace_once(text,old,new,'upper scale test')
          write(path,text)

          display_test='''const assert=require("node:assert/strict"),fs=require("node:fs"),D=require("../src/chart-difficulty.js");
assert.equal(D.VERSION,"local-v6");
assert.equal(D.MAX_STARS,Infinity);
assert.ok(D.displayScale(20)>15,"automatic difficulty display must extend beyond 15 stars");
const game=fs.readFileSync("src/game.js","utf8");
for(const needle of ["function declaredDifficultyLevel","declaredLevel:declaredDifficultyLevel(songData,difficultyId)","function formatDifficultyView","LV ${level} · AUTO ${auto}"]){assert.ok(game.includes(needle),needle);}
assert.match(game,/return \{\.\.\.chartDifficulty\.calculate\(c\),declaredLevel:declaredDifficultyLevel\(selectedSong,mode\)\}/);
const powerStart=game.indexOf("function powerPreviewHtml");
const powerEnd=game.indexOf("function renderSongSelect",powerStart);
const powerBody=game.slice(powerStart,powerEnd);
assert.ok(powerBody.includes("const stars=Number(diff?.stars)"),"POWER preview must continue using automatic stars");
assert.ok(!powerBody.includes("declaredLevel"),"authored LEVEL must not affect POWER preview");
console.log("difficulty display separation tests passed");
'''
          write(Path('tests/difficulty-display.test.js'),display_test)

          # Web/PWA release metadata and cache revision.
          new_revision='20260805-difficulty-level-display-0.9.54'
          write(Path('src/version.js'),'''(function(root){
  "use strict";
  root.CircleMixVersion = Object.freeze({
    version: "0.9.35",
    buildDate: "2026-08-05",
    cacheRevision: "20260805-difficulty-level-display-0.9.54"
  });
})(typeof window !== "undefined" ? window : self);
''')
          for file in ['index.html','editor.html']:
              text=read(Path(file)).replace('20260802-unlimited-content-0.9.53',new_revision)
              write(Path(file),text)

          entry='''  { version: "0.9.35", date: "2026-08-05", title: "UNLIMITED DIFFICULTY DISPLAY", summary: "작성 LEVEL과 자동 별을 분리 표시하고 자동 난이도의 15★ 상한을 제거했습니다.", changes: [
    { category: "LEVEL", text: "LOCAL 난이도 버튼과 곡 목록에 .cmix 작성 LEVEL을 그대로 표시" },
    { category: "AUTO", text: "자동 난이도는 별도 AUTO 값으로 함께 표시하며 15★에서 잘리지 않도록 확장" },
    { category: "POWER", text: "정렬·POWER·플레이 계산은 계속 자동 별을 사용해 작성 LEVEL 조작의 영향을 차단" },
    { category: "CACHE", text: "웹·PWA·에디터를 새 캐시 리비전으로 갱신" }
  ] },
'''
          path=Path('src/changelog.js')
          text=read(path)
          text=replace_once(text,'window.CircleMixChangelog = [\n','window.CircleMixChangelog = [\n'+entry,'changelog insertion')
          write(path,text)

          path=Path('src/build-config.js')
          text=read(path)
          replacement='''const sharedRelease={version:"0.9.35",date:"2026-08-05",title:"UNLIMITED DIFFICULTY DISPLAY",summary:"작성 LEVEL과 자동 별을 분리 표시하고 자동 난이도의 15★ 상한을 제거했습니다.",changes:[
    {category:"LEVEL",text:"LOCAL 난이도 버튼과 곡 목록에 .cmix 작성 LEVEL을 그대로 표시합니다."},
    {category:"AUTO",text:"자동 난이도를 별도 AUTO 값으로 함께 표시하며 15★ 이상도 그대로 표시합니다."},
    {category:"POWER",text:"정렬·POWER·플레이 계산은 자동 별을 계속 사용해 작성 LEVEL 조작의 영향을 받지 않습니다."},
    {category:"COMPATIBILITY",text:"기존 LOCAL 곡·채보·기록과 설정을 유지합니다."}
  ]};'''
          text,count=re.subn(r'const sharedRelease=\{version:"0\.9\.34"[\s\S]*?\n  \]\};',replacement,text,count=1)
          if count!=1: raise SystemExit(f'build-config release block: {count}')
          write(path,text)

          # Desktop and Android package version 0.9.54.
          version_files=[
              'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock',
              'src-tauri/tauri.conf.json','src-tauri/tauri.release.conf.json','src-tauri/tauri.android.conf.json',
              'tests/android-app.test.js','tests/desktop-updater.test.js','tests/desktop-installer.test.js',
              'tests/pwa-update.test.js','tests/song-select-overflow-browser.test.js'
          ]
          for file in version_files:
              path=Path(file)
              if not path.exists(): continue
              text=read(path).replace('0.9.53','0.9.54').replace('9053','9054')
              if file in ['tests/pwa-update.test.js','tests/song-select-overflow-browser.test.js']:
                  text=text.replace('0.9.34','0.9.35')
              write(path,text)

          # Package test and Android prepare script path.
          path=Path('package.json')
          package=json.loads(read(path))
          package['version']='0.9.54'
          package['scripts']['test']=package['scripts']['test'].replace('&& node tests/chart-difficulty.test.js','&& node tests/difficulty-display.test.js && node tests/chart-difficulty.test.js')
          package['scripts']['android:prepare']=package['scripts']['android:prepare'].replace('prepare-android-0.9.53.js','prepare-android-0.9.54.js')
          write(path,json.dumps(package,ensure_ascii=False,indent=2)+'\n')

          old_path=Path('scripts/prepare-android-0.9.53.js')
          new_path=Path('scripts/prepare-android-0.9.54.js')
          android=read(old_path).replace('0.9.53','0.9.54')
          android=android.replace('ANDROID 0.9.54","summary":"난이도와 맵·채보·노트 개수의 고정 상한을 제거한 Android 업데이트입니다.','ANDROID 0.9.54","summary":"작성 LEVEL과 자동 별을 분리 표시하고 자동 난이도 상한을 제거한 Android 업데이트입니다.')
          android=android.replace('{category:"DIFFICULTY",text:"20보다 높은 표시 난이도도 가져오고 내보낼 수 있으며 에디터가 레벨을 20으로 줄이지 않습니다."},','{category:"LEVEL",text:"LOCAL 난이도 버튼과 곡 목록에 작성 LEVEL을 그대로 표시합니다."},')
          android=android.replace('{category:"CONTENT LIMITS",text:"LOCAL SONGS와 .cmix의 곡·채보·파일·노트 개수에 고정된 상한을 두지 않습니다."},','{category:"AUTO",text:"자동 난이도를 별도 AUTO 값으로 표시하며 15★ 이상의 결과도 자르지 않습니다."},')
          android=android.replace('{category:"LARGE PACKAGES",text:"300개 이상의 채보와 100,000개를 넘는 노트도 파일 용량 범위 안에서 검증할 수 있습니다."},','{category:"POWER",text:"정렬과 POWER는 자동 별을 계속 사용해 작성 LEVEL 조작의 영향을 받지 않습니다."},')
          android=android.replace('{category:"SAFETY",text:"개별 파일·전체 압축 해제 용량, 압축률, 경로 이동과 금지 확장자 방어는 그대로 유지됩니다."},','{category:"CONTENT LIMITS",text:"곡·채보·파일·노트 개수의 고정 상한 해제와 보안 용량 검사는 그대로 유지됩니다."},')
          android=android.replace('0.9.52 위에 서명된 업데이트로 설치할 수 있습니다.','0.9.53 위에 서명된 업데이트로 설치할 수 있습니다.')
          anchor="const validator=fs.readFileSync(path.join(out,'src/cmix-validator.js'),'utf8');"
          audit="""const difficulty=fs.readFileSync(path.join(out,'src/chart-difficulty.js'),'utf8');
if(!difficulty.includes('MAX_STARS=Number.POSITIVE_INFINITY'))throw new Error('Android 0.9.54 automatic difficulty is still capped');
const game=fs.readFileSync(path.join(out,'src/game.js'),'utf8');
for(const needle of ['declaredDifficultyLevel','formatDifficultyView'])if(!game.includes(needle))throw new Error(`Android 0.9.54 payload is missing ${needle}`);
"""
          android=replace_once(android,anchor,audit+anchor,'android difficulty audit')
          write(new_path,android)
          old_path.unlink()

          # Ensure package-lock top-level version is synchronized after text replacements.
          lock=json.loads(read(Path('package-lock.json')))
          lock['version']='0.9.54'
          if '' in lock.get('packages',{}): lock['packages']['']['version']='0.9.54'
          write(Path('package-lock.json'),json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          # Final source assertions.
          assert 'MAX_STARS=Number.POSITIVE_INFINITY' in read(Path('src/chart-difficulty.js'))
          assert 'LV ${level} · AUTO ${auto}' in read(Path('src/game.js'))
          assert 'version: "0.9.35"' in read(Path('src/version.js'))
          assert json.loads(read(Path('package.json')))['version']=='0.9.54'
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: show unlimited authored and automatic difficulty"
          git push origin HEAD:agent/fix-unlimited-difficulty-display
