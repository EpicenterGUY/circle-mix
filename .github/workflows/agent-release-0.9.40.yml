name: Agent release 0.9.40

on:
  push:
    branches:
      - agent/release-0.9.40-aim-flow

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply release metadata
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact("package.json", '  "version": "0.9.39"', '  "version": "0.9.40"')
          replace_exact("package-lock.json", '"version": "0.9.39"', '"version": "0.9.40"', expected=2)
          replace_exact("src-tauri/Cargo.toml", 'version = "0.9.39"', 'version = "0.9.40"')
          replace_exact("src-tauri/tauri.conf.json", '  "version": "0.9.39"', '  "version": "0.9.40"')

          Path("src/version.js").write_text('''(function(root){
            "use strict";
            root.CircleMixVersion = Object.freeze({
              version: "0.9.32",
              buildDate: "2026-07-25",
              cacheRevision: "20260725-aim-flow-pulse-guide-v1"
            });
          })(typeof window !== "undefined" ? window : self);
          '''.replace("          ", ""), encoding="utf-8")

          changelog_path = Path("src/changelog.js")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "window.CircleMixChangelog = [\n"
          if changelog.count(marker) != 1:
              raise SystemExit("src/changelog.js: changelog array marker is missing or duplicated")
          entry = '''  { version: "0.9.32", date: "2026-07-25", title: "AIM FLOW & PULSE GUIDANCE", summary: "PULSE 다음 에임 안내와 AUTO·큰 각도 마우스 이동의 시각 흐름을 개선했습니다.", changes: [
            { category: "PULSE", text: "PULSE 뒤 가장 이른 동시치기 에임을 최대 두 방향 화살표와 ×N 표시로 안내" },
            { category: "AUTO", text: "판정은 즉시 PERFECT를 유지하면서 화면의 AUTO 에임 팔만 최단 원형 경로로 자연스럽게 이동" },
            { category: "AIM", text: "SMOOTH는 작은 이동만 완화하고 90도 이상의 큰 점프는 즉시 실제 판정 위치를 표시" },
            { category: "CACHE", text: "새 0.9.32 캐시 리비전으로 설치형 PWA의 game.js와 앱 셸을 확실히 갱신" }
          ] },
          '''
          changelog_path.write_text(changelog.replace(marker, marker + entry, 1), encoding="utf-8")

          replace_exact("scripts/prepare-desktop.js", "const DESKTOP_VERSION='0.9.39';", "const DESKTOP_VERSION='0.9.40';")
          replace_exact("scripts/prepare-desktop.js", '  const release={version:"${DESKTOP_VERSION}",date:"${DESKTOP_BUILD_DATE}",title:"PULSE MULTI-AIM GUIDANCE",summary:"PULSE와 겹치거나 바로 이어지는 여러 에임 노트를 더 명확하게 안내하고 Windows 업데이트 로그 표시를 안정화했습니다.",changes:[\n    {category:"PULSE",text:"PULSE 이후 가장 이른 비-PULSE 동시치기 그룹을 찾아 최대 두 방향을 짧은 중앙 화살표로 함께 표시합니다."},\n    {category:"CHORD",text:"같은 방향의 중복 액션이나 세 개 이상의 동시 노트는 ×2·×3 카운트로 표시해 화면을 복잡하게 만들지 않습니다."},\n    {category:"DESKTOP",text:"업데이트 뒤 타이틀 초기화 순서 때문에 자동 변경 로그가 누락되던 경우를 한 번 더 안전하게 확인합니다."},\n    {category:"COMPATIBILITY",text:"판정 시간, 점수, 채보 데이터, PC·모바일 입력, 설정과 LOCAL .cmix 데이터는 그대로 유지됩니다."}\n  ]};', '  const release={version:"${DESKTOP_VERSION}",date:"${DESKTOP_BUILD_DATE}",title:"AUTO & LARGE-ANGLE AIM FLOW",summary:"AUTO 이동을 자연스럽게 표시하고 큰 각도 마우스 에임이 실제 판정 위치를 즉시 따라가도록 개선했습니다.",changes:[\n    {category:"AUTO",text:"AUTO 판정은 즉시 PERFECT를 유지하면서 화면의 에임 팔만 다음 노트까지 최단 원형 경로로 이동합니다."},\n    {category:"PATH",text:"SLIDE·TRACE 진행 중 AUTO 에임이 프레임레이트와 무관한 짧은 시각 응답으로 경로를 따라갑니다."},\n    {category:"MOUSE",text:"SMOOTH는 작은 이동만 부드럽게 유지하고 90도 이상의 큰 에임 점프는 즉시 실제 판정 위치를 표시합니다."},\n    {category:"COMPATIBILITY",text:"판정 시간, 점수, 채보 데이터, 입력 규칙, 설정과 LOCAL .cmix 데이터는 그대로 유지됩니다."}\n  ]};')

          replace_exact("scripts/audit-desktop-dist.js", "if(!desktopRelease.includes('version:\"0.9.39\"')||!desktopRelease.includes('PULSE MULTI-AIM GUIDANCE')||!desktopRelease.includes('CircleMixChangelog'))throw new Error('desktop 0.9.39 release metadata is missing');", "if(!desktopRelease.includes('version:\"0.9.40\"')||!desktopRelease.includes('AUTO & LARGE-ANGLE AIM FLOW')||!desktopRelease.includes('CircleMixChangelog'))throw new Error('desktop 0.9.40 release metadata is missing');")
          replace_exact("scripts/audit-desktop-dist.js", "if(releaseWindow.CircleMixVersion?.version!=='0.9.39'||releaseWindow.CircleMixChangelog?.[0]?.version!=='0.9.39'||releaseWindow.CircleMixChangelog?.[0]?.title!=='PULSE MULTI-AIM GUIDANCE')throw new Error('desktop release metadata override did not expose 0.9.39');", "if(releaseWindow.CircleMixVersion?.version!=='0.9.40'||releaseWindow.CircleMixChangelog?.[0]?.version!=='0.9.40'||releaseWindow.CircleMixChangelog?.[0]?.title!=='AUTO & LARGE-ANGLE AIM FLOW')throw new Error('desktop release metadata override did not expose 0.9.40');")
          replace_exact("scripts/audit-desktop-dist.js", "const seenWindow={CircleMixVersion:{version:'0.9.37'},CircleMixChangelog:[],localStorage:{getItem(){return '0.9.39';}}};", "const seenWindow={CircleMixVersion:{version:'0.9.37'},CircleMixChangelog:[],localStorage:{getItem(){return '0.9.40';}}};")
          replace_exact("scripts/audit-desktop-dist.js", "if(!desktopGame.includes('PULSE_AIM_MULTI_TARGET_GUIDE')||!desktopGame.includes('function nextAimNotesAfterPulse')||!desktopGame.includes('arrowTargets.length>=2')||!desktopGame.includes('targets.length>arrowTargets.length'))throw new Error('desktop PULSE multi-aim guide is missing');", "if(!desktopGame.includes('PULSE_AIM_MULTI_TARGET_GUIDE')||!desktopGame.includes('function nextAimNotesAfterPulse')||!desktopGame.includes('arrowTargets.length>=2')||!desktopGame.includes('targets.length>arrowTargets.length'))throw new Error('desktop PULSE multi-aim guide is missing');\nif(!desktopGame.includes('AUTO_VISUAL_AIM_FLOW')||!desktopGame.includes('AUTO_VISUAL_AIM_PATH_RESPONSE')||!desktopGame.includes('MOUSE_AIM_LARGE_JUMP_FLOW')||!desktopGame.includes('return !isAutoActive() && judgementMarkerVisibleFor'))throw new Error('desktop AUTO or large-angle aim flow is missing');")

          replace_exact("tests/desktop-installer.test.js", "assert.equal(tauri.version,'0.9.39','Windows installer must publish the PULSE multi-aim guidance version');", "assert.equal(tauri.version,'0.9.40','Windows installer must publish the AUTO aim flow version');")
          replace_exact("tests/desktop-installer.test.js", "assert.match(prepare,/DESKTOP_VERSION='0\\.9\\.39'/,'desktop distribution must expose version 0.9.39');", "assert.match(prepare,/DESKTOP_VERSION='0\\.9\\.40'/,'desktop distribution must expose version 0.9.40');")
          replace_exact("tests/desktop-installer.test.js", "assert.match(prepare,/PULSE MULTI-AIM GUIDANCE/,'desktop changelog must announce the 0.9.39 sound release');", "assert.match(prepare,/AUTO & LARGE-ANGLE AIM FLOW/,'desktop changelog must announce the 0.9.40 aim release');")
          replace_exact("tests/desktop-installer.test.js", "assert.match(audit,/desktop PULSE multi-aim guide is missing/,'desktop audit must verify simultaneous PULSE aim guidance');", "assert.match(audit,/desktop PULSE multi-aim guide is missing/,'desktop audit must verify simultaneous PULSE aim guidance');\nassert.match(audit,/desktop AUTO or large-angle aim flow is missing/,'desktop audit must verify the latest AUTO and mouse aim flow');")

          replace_exact("tests/desktop-updater.test.js", "assert.equal(tauri.version,'0.9.39');", "assert.equal(tauri.version,'0.9.40');")

          pwa_path = Path("tests/pwa-update.test.js")
          pwa = pwa_path.read_text(encoding="utf-8")
          pwa = pwa.replace('const serviceWorkerSource = fs.readFileSync("service-worker.js", "utf8");', 'const serviceWorkerSource = fs.readFileSync("service-worker.js", "utf8");\nconst changelogSource = fs.readFileSync("src/changelog.js", "utf8");')
          pwa = pwa.replace('assert.equal(browser.window.CircleMixVersion.version, "0.9.31");\n  assert.ok(browser.window.CircleMixVersion.cacheRevision);', 'assert.equal(browser.window.CircleMixVersion.version, "0.9.32");\n  assert.equal(browser.window.CircleMixVersion.cacheRevision, "20260725-aim-flow-pulse-guide-v1");')
          pwa = pwa.replace('  assert.match(serviceWorkerSource, /cacheRevision/);\n});', '  assert.match(serviceWorkerSource, /cacheRevision/);\n  assert.match(serviceWorkerSource, /versioned\\("\\.\\/src\\/game\\.js"\\)/);\n  assert.match(changelogSource, /window\\.CircleMixChangelog\\s*=\\s*\\[\\s*\\{ version: "0\\.9\\.32"/);\n  assert.match(changelogSource, /AIM FLOW & PULSE GUIDANCE/);\n});')
          if pwa == pwa_path.read_text(encoding="utf-8"):
              raise SystemExit("tests/pwa-update.test.js: no changes applied")
          pwa_path.write_text(pwa, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and smoke tests
        run: |
          npm test
          node scripts/check-release-metadata.js
          npm run desktop:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

      - name: Verify release-only scope
        shell: bash
        run: |
          git diff --check
          python <<'PY'
          import subprocess
          expected = {
              "package.json",
              "package-lock.json",
              "scripts/audit-desktop-dist.js",
              "scripts/prepare-desktop.js",
              "src-tauri/Cargo.toml",
              "src-tauri/tauri.conf.json",
              "src/changelog.js",
              "src/version.js",
              "tests/desktop-installer.test.js",
              "tests/desktop-updater.test.js",
              "tests/pwa-update.test.js",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"Unexpected release diff. expected={sorted(expected)} actual={sorted(changed)}")
          PY

      - name: Commit tested release metadata
        shell: bash
        run: |
          rm .github/workflows/agent-release-0.9.40.yml
          git config user.name "circle-mix-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          python <<'PY'
          import subprocess
          expected = {
              "package.json",
              "package-lock.json",
              "scripts/audit-desktop-dist.js",
              "scripts/prepare-desktop.js",
              "src-tauri/Cargo.toml",
              "src-tauri/tauri.conf.json",
              "src/changelog.js",
              "src/version.js",
              "tests/desktop-installer.test.js",
              "tests/desktop-updater.test.js",
              "tests/pwa-update.test.js",
          }
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only", "origin/main...HEAD"], text=True, stderr=subprocess.DEVNULL).splitlines())
          staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if staged != expected | {".github/workflows/agent-release-0.9.40.yml"}:
              raise SystemExit(f"Unexpected staged files: {sorted(staged)}")
          PY
          git commit -m "release: publish aim flow in 0.9.40"
          git push origin HEAD:agent/release-0.9.40-aim-flow
