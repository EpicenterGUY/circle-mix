name: PR 158 main sync

on:
  push:
    branches: [agent/editor-playtest-controls]
    paths: [.github/workflows/pr158-sync-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' editor.html package.json src/version.js tests/pwa-update.test.js | sort)"
          test "$conflicts" = "$expected"
          git checkout --ours editor.html
          git checkout --theirs package.json src/version.js tests/pwa-update.test.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json')
          data=json.loads(p.read_text())
          unit=data['scripts']['test']
          if 'node --check src/editor-playtest.js' not in unit:
              unit=unit.replace('node --check src/editor.js','node --check src/editor-playtest.js && node --check src/editor.js')
          if 'node tests/editor-playtest.test.js' not in unit:
              unit=unit.replace('node tests/editor-feasibility.test.js','node tests/editor-feasibility.test.js && node tests/editor-playtest.test.js')
          browser=data['scripts']['test:browser']
          if 'node tests/editor-playtest-browser.test.js' not in browser:
              browser=browser.replace('node tests/editor-feasibility-browser.test.js','node tests/editor-feasibility-browser.test.js && node tests/editor-playtest-browser.test.js')
          data['scripts']['test']=unit
          data['scripts']['test:browser']=browser
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('tests/pwa-update.test.js')
          text=p.read_text()
          needle='  assert.match(serviceWorkerSource, /versioned\\("\\.\\/src\\/game\\.js"\\)/);\n'
          if 'src\\/editor-playtest\\.js' not in text:
              text=text.replace(needle,needle+'  assert.match(serviceWorkerSource, /versioned\\("\\.\\/src\\/editor-playtest\\.js"\\)/);\n')
          p.write_text(text)
          PY
          git add editor.html package.json src/version.js tests/pwa-update.test.js
          git diff --check
          rm -f .github/workflows/pr158-sync-diagnostic.yml .github/workflows/pr158-sync-fix.yml pr158-merge-diagnostic.txt
          git add -A
          git commit -m "chore: sync editor playtest branch with main"
          git push origin HEAD:agent/editor-playtest-controls
