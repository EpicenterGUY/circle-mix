name: Implement chart power preview v2

on:
  push:
    branches:
      - feature/power-preview
    paths:
      - .github/workflows/implement-power-preview-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply corrected implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/implement-power-preview.yml').read_text(encoding='utf-8')
          start=workflow.index("          python3 <<'PY'\n")+len("          python3 <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          script=textwrap.dedent(workflow[start:end])
          old='''  index_marker="if(!desktopIndex.includes('./src/desktop-release.js')||!desktopIndex.includes('./src/desktop-updater.js'))throw new Error('desktop release or updater script is not loaded by index.html');"\n  index_new="if(!desktopIndex.includes('./src/power.js'))throw new Error('desktop POWER forecast model is not loaded by index.html');\\n"+index_marker\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          new='''  index_marker="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  index_new="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js','./src/power.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          if old not in script:
            raise SystemExit('unable to patch the implementation script audit marker')
          script=script.replace(old,new,1)
          exec(compile(script,'implement-power-preview.py','exec'),{'__name__':'__main__'})
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/power.js src/game.js style.css index.html service-worker.js scripts/prepare-desktop.js scripts/audit-desktop-dist.js scripts/audit-android-dist.js tests/power-preview.test.js tests/power-preview-browser.test.js tests/smoke.test.js package.json
          git commit -m "feat: show accuracy power forecasts by chart difficulty"
          git push origin HEAD:feature/power-preview
