name: Track Android 0.9.50 production release

on:
  push:
    branches: [release/android-0.9.50]
    paths: [.github/workflows/android-release-status-0.9.50.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: EpicenterGUY/circle-mix
      MERGE_SHA: 210a7d0f052a9e70aad02163f944ae5bd1814a3b
      TAG: android-v0.9.50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/android-0.9.50
      - name: Wait for production release workflow
        shell: bash
        run: |
          set -euo pipefail
          report=android-release-status-0.9.50.json
          run='null'
          for attempt in $(seq 1 50); do
            runs="$(gh run list --repo "$REPO" --workflow android-release.yml --branch main --limit 10 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt)"
            run="$(jq -c --arg sha "$MERGE_SHA" '[.[] | select(.headSha==$sha)][0] // null' <<<"$runs")"
            status="$(jq -r '.status // "missing"' <<<"$run")"
            echo "attempt=$attempt status=$status run=$run"
            if [ "$status" = completed ]; then break; fi
            sleep 15
          done
          release='null'
          if gh release view "$TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,url,targetCommitish,assets > /tmp/release.json 2>/tmp/release-error.txt; then
            release="$(cat /tmp/release.json)"
          fi
          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg mergeSha "$MERGE_SHA" \
            --arg tag "$TAG" \
            --argjson run "$run" \
            --argjson release "$release" \
            --rawfile releaseError /tmp/release-error.txt \
            '{checkedAt:$checkedAt,mergeSha:$mergeSha,tag:$tag,run:$run,release:$release,releaseError:$releaseError}' > "$report"
          cat "$report"
      - name: Commit status report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-release-status-0.9.50.json
          git commit -m "chore: record Android 0.9.50 production release status"
          git push origin HEAD:release/android-0.9.50
