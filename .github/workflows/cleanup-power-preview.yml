name: Cleanup POWER preview branch

on:
  push:
    branches:
      - feature/power-preview
    paths:
      - .github/workflows/cleanup-power-preview.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-preview
      - name: Remove temporary implementation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/cleanup-power-preview.yml \
            .github/workflows/implement-power-preview.yml \
            .github/workflows/implement-power-preview-v2.yml \
            .github/workflows/implement-power-preview-v3.yml \
            .github/workflows/implement-power-preview-v4.yml \
            .github/workflows/power-preview-diagnostic.yml \
            .github/workflows/snapshot-power-preview-v4-latest.yml \
            .github/diagnostics/power-preview-exact-jobs.json \
            .github/diagnostics/power-preview-exact-run.json \
            .github/diagnostics/power-preview-jobs.json \
            .github/diagnostics/power-preview-runs.json \
            .github/diagnostics/power-preview-v2-jobs.json \
            .github/diagnostics/power-preview-v2-runs.json \
            .github/diagnostics/power-preview-v3-jobs.json \
            .github/diagnostics/power-preview-v3-runs.json \
            .github/diagnostics/power-preview-v4-jobs.json \
            .github/diagnostics/power-preview-v4-runs.json \
            .github/diagnostics/power-preview-v4-target-jobs.json \
            .github/diagnostics/power-preview-v4-target-run.json
          rmdir .github/diagnostics 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove POWER preview implementation diagnostics"
          git push origin HEAD:feature/power-preview
