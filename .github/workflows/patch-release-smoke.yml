name: Patch release smoke expectation

on:
  push:
    branches:
      - agent/release-unlimited-content-0.9.53
    paths:
      - .github/workflows/patch-release-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-unlimited-content-0.9.53
      - name: Replace hard-coded web release expectation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tests/smoke.test.js';
          const source=fs.readFileSync(path,'utf8');
          const before=`test("web release metadata is shared without duplicate hard-coded versions", () => {
          const version = fs.readFileSync("src/version.js", "utf8");
          const pwa = fs.readFileSync("src/pwa.js", "utf8");
          const sw = fs.readFileSync("service-worker.js", "utf8");
          const changelog = fs.readFileSync("src/changelog.js", "utf8");
          assert.match(version, /version:\\s*"0\\.9\\.33"/);
          assert.match(version, /cacheRevision:/);
          assert.match(pwa, /const RELEASE=window\\.CircleMixVersion/);
          assert.match(sw, /^importScripts\\("\\.\\/src\\/version\\.js"\\);/);
          assert.doesNotMatch(pwa, /const VERSION="0\\.9\\.33"/);
          assert.doesNotMatch(sw, /const VERSION = "0\\.9\\.33"/);
          assert.match(changelog, /version:\\s*"0\\.9\\.33"/);
          });`;
          const after=`test("web release metadata is shared without duplicate hard-coded versions", () => {
          const version = fs.readFileSync("src/version.js", "utf8");
          const pwa = fs.readFileSync("src/pwa.js", "utf8");
          const sw = fs.readFileSync("service-worker.js", "utf8");
          const changelog = fs.readFileSync("src/changelog.js", "utf8");
          const releaseVersion=/version:\\s*"([^"]+)"/.exec(version)?.[1];
          const changelogVersion=/window\\.CircleMixChangelog\\s*=\\s*\\[\\s*\\{\\s*version:\\s*"([^"]+)"/.exec(changelog)?.[1];
          assert.ok(releaseVersion);
          assert.equal(changelogVersion,releaseVersion);
          assert.match(version, /cacheRevision:/);
          assert.match(pwa, /const RELEASE=window\\.CircleMixVersion/);
          assert.match(sw, /^importScripts\\("\\.\\/src\\/version\\.js"\\);/);
          assert.doesNotMatch(pwa, /const VERSION\\s*=\\s*"\\d+\\.\\d+\\.\\d+"/);
          assert.doesNotMatch(sw, /const VERSION\\s*=\\s*"\\d+\\.\\d+\\.\\d+"/);
          });`;
          if(!source.includes(before))throw new Error('Expected stale release test block was not found');
          fs.writeFileSync(path,source.replace(before,after));
          NODE
      - name: Commit focused test fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/smoke.test.js
          git commit -m "test: derive smoke release version dynamically"
          git push origin HEAD:agent/release-unlimited-content-0.9.53
