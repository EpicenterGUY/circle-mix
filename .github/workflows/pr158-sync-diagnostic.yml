name: PR 158 sync diagnostic

on:
  push:
    branches:
      - agent/editor-playtest-controls
    paths:
      - .github/workflows/pr158-sync-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge with current main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          {
            echo "MERGE_EXIT=$status"
            echo "=== UNMERGED FILES ==="
            git diff --name-only --diff-filter=U || true
            echo "=== CONFLICT MARKERS ==="
            for file in $(git diff --name-only --diff-filter=U); do
              echo "--- $file ---"
              grep -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
            done
            echo "=== STATUS ==="
            git status --short
          } > /tmp/pr158-merge-diagnostic.txt
          cat /tmp/pr158-merge-diagnostic.txt
          git merge --abort 2>/dev/null || true
          cp /tmp/pr158-merge-diagnostic.txt pr158-merge-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr158-merge-diagnostic.txt
          git commit -m "chore: record PR 158 merge conflicts" || true
          git push origin HEAD:agent/editor-playtest-controls
