name: PR 158 sync diagnostic

on:
  push:
    branches:
      - agent/editor-playtest-controls
    paths:
      - .github/workflows/pr158-sync-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge with current main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_EXIT=$status"
          echo "=== UNMERGED FILES ==="
          git diff --name-only --diff-filter=U || true
          echo "=== CONFLICT MARKERS ==="
          for file in $(git diff --name-only --diff-filter=U); do
            echo "--- $file ---"
            grep -n -C 6 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
          done
          echo "=== STATUS ==="
          git status --short
          git merge --abort 2>/dev/null || true
          exit $status
