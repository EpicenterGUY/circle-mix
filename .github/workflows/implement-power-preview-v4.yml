name: Implement chart power preview v4

on:
  push:
    branches:
      - feature/power-preview
    paths:
      - .github/workflows/implement-power-preview-v4.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/implement-power-preview.yml').read_text(encoding='utf-8')
          start=workflow.index("          python3 <<'PY'\n")+len("          python3 <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          script=textwrap.dedent(workflow[start:end])

          old_audit='''  index_marker="if(!desktopIndex.includes('./src/desktop-release.js')||!desktopIndex.includes('./src/desktop-updater.js'))throw new Error('desktop release or updater script is not loaded by index.html');"\n  index_new="if(!desktopIndex.includes('./src/power.js'))throw new Error('desktop POWER forecast model is not loaded by index.html');\\n"+index_marker\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          new_audit='''  index_marker="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  index_new="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js','./src/power.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          if old_audit not in script: raise SystemExit('unable to patch desktop audit marker')
          script=script.replace(old_audit,new_audit,1)

          replacements={
            "fs.existsSync(path.join(root,'src/power.js'))":"fs.existsSync('src/power.js')",
            "assert.match(html,":"assert.match(fs.readFileSync('index.html','utf8'),",
            "assert.match(game,":"assert.match(fs.readFileSync('src/game.js','utf8'),",
            "localStorage.setItem(\"circleMixLastSeenVersion\",\"0.9.50\");":"localStorage.setItem(\"circleMixLastSeenVersion\",\"0.9.50\");localStorage.setItem(\"circleMixTutorialCompleted\",\"true\");localStorage.setItem(\"circleMixTutorialPromptAnswered\",\"true\");",
            "await page.waitForFunction(()=>window.CircleMixPower&&document.querySelector(\".songPowerPreview .songPowerCell\"),{timeout:10000});":"await page.waitForFunction(()=>window.CircleMixPower&&document.getElementById(\"safeStart\"),{timeout:10000});await page.click(\"#safeStart\");await page.waitForFunction(()=>window.CircleMixPower&&document.querySelector(\".songPowerPreview .songPowerCell\"),{timeout:10000});"
          }
          for old,new in replacements.items():
            if old not in script: raise SystemExit(f'unable to patch generated source: {old}')
            script=script.replace(old,new,1)
          exec(compile(script,'implement-power-preview.py','exec'),{'__name__':'__main__'})
          PY
      - run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/power.js src/game.js style.css index.html service-worker.js scripts/prepare-desktop.js scripts/audit-desktop-dist.js scripts/audit-android-dist.js tests/power-preview.test.js tests/power-preview-browser.test.js tests/smoke.test.js package.json
          git commit -m "feat: show accuracy power forecasts by chart difficulty"
          git push origin HEAD:feature/power-preview
