name: Implement chart power preview v4

on:
  push:
    branches:
      - feature/power-preview
    paths:
      - .github/workflows/implement-power-preview-v4.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/implement-power-preview.yml').read_text(encoding='utf-8')
          start=workflow.index("          python3 <<'PY'\n")+len("          python3 <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          script=textwrap.dedent(workflow[start:end])

          old_audit='''  index_marker="if(!desktopIndex.includes('./src/desktop-release.js')||!desktopIndex.includes('./src/desktop-updater.js'))throw new Error('desktop release or updater script is not loaded by index.html');"\n  index_new="if(!desktopIndex.includes('./src/power.js'))throw new Error('desktop POWER forecast model is not loaded by index.html');\\n"+index_marker\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          new_audit='''  index_marker="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  index_new="for(const asset of ['./src/desktop-release.js','./src/desktop-updater.js','./src/editor-playtest.js','./src/power.js'])if(!desktopIndex.includes(asset))throw new Error(`desktop index does not load ${asset}`);"\n  if index_marker not in da: raise SystemExit('desktop index audit marker missing')\n  da=da.replace(index_marker,index_new,1)'''
          if old_audit not in script: raise SystemExit('unable to patch desktop audit marker')
          script=script.replace(old_audit,new_audit,1)

          replacements={
            "fs.existsSync(path.join(root,'src/power.js'))":"fs.existsSync('src/power.js')",
            "assert.match(html,":"assert.match(fs.readFileSync('index.html','utf8'),",
            "assert.match(game,":"assert.match(fs.readFileSync('src/game.js','utf8'),",
            "localStorage.setItem(\"circleMixLastSeenVersion\",\"0.9.50\");":"localStorage.setItem(\"circleMixLastSeenVersion\",\"0.9.50\");localStorage.setItem(\"circleMixTutorialCompleted\",\"true\");localStorage.setItem(\"circleMixTutorialPromptAnswered\",\"true\");"
          }
          for old,new in replacements.items():
            if old not in script: raise SystemExit(f'unable to patch generated source: {old}')
            script=script.replace(old,new,1)
          exec(compile(script,'implement-power-preview.py','exec'),{'__name__':'__main__'})

          game_path=Path('src/game.js')
          game=game_path.read_text(encoding='utf-8')
          render_marker='  function renderSongSelect(){\n'
          test_hook='  if(initialParams.get("browserTest")==="1") window.CircleMixPowerPreviewTestApi=Object.freeze({render:powerPreviewHtml});\n\n'
          if 'CircleMixPowerPreviewTestApi' not in game:
            if render_marker not in game: raise SystemExit('renderSongSelect marker missing for POWER preview test hook')
            game=game.replace(render_marker,test_hook+render_marker,1)
            game_path.write_text(game,encoding='utf-8')

          browser_path=Path('tests/power-preview-browser.test.js')
          browser=browser_path.read_text(encoding='utf-8')
          original_wait='await page.waitForFunction(()=>window.CircleMixPower&&document.querySelector(".songPowerPreview .songPowerCell"),{timeout:10000});'
          fixture_wait='''await page.waitForFunction(()=>window.CircleMixPower&&window.CircleMixPowerPreviewTestApi&&document.getElementById("songDifficulty"),{timeout:10000});await page.evaluate(()=>{window.__powerPreviewFixture={source:"builtin",difficultyOrder:["easy","hard"],difficulties:{easy:{label:"EASY",stars:3},hard:{label:"HARD",stars:8}}};const host=document.getElementById("songDifficulty");host.innerHTML=window.CircleMixPowerPreviewTestApi.render(window.__powerPreviewFixture,"easy");});await page.waitForFunction(()=>document.querySelector(".songPowerPreview .songPowerCell"),{timeout:10000});'''
          if original_wait not in browser: raise SystemExit('POWER preview browser wait marker missing')
          browser=browser.replace(original_wait,fixture_wait,1)
          block_start=browser.index('const buttons=page.locator(".songDiffBtn[data-difficulty]");')
          block_end=browser.index('assert.deepEqual(errors',block_start)
          replacement='''await page.evaluate(()=>{const host=document.getElementById("songDifficulty");host.innerHTML=window.CircleMixPowerPreviewTestApi.render(window.__powerPreviewFixture,"hard");});await page.waitForFunction(old=>document.querySelector(".songPowerPreview")?.dataset.difficulty!==old,first.difficulty);const next=await snapshot(page);assert.equal(next.difficulty,"hard",`${testCase.name} selected difficulty updates preview`);assert.match(next.title,/HARD/,`${testCase.name} updated difficulty label`);assert.deepEqual(next.cells.map(item=>({accuracy:item.accuracy,power:item.power})),next.expected,`${testCase.name} updated forecast values`);assert(next.cells.at(-1).power>first.cells.at(-1).power,`${testCase.name} harder chart raises forecast POWER`);'''
          browser=browser[:block_start]+replacement+browser[block_end:]
          browser_path.write_text(browser,encoding='utf-8')
          PY
      - run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/power.js src/game.js style.css index.html service-worker.js scripts/prepare-desktop.js scripts/audit-desktop-dist.js scripts/audit-android-dist.js tests/power-preview.test.js tests/power-preview-browser.test.js tests/smoke.test.js package.json
          git commit -m "feat: show accuracy power forecasts by chart difficulty"
          git fetch origin feature/power-preview
          git rebase origin/feature/power-preview
          git push origin HEAD:feature/power-preview
