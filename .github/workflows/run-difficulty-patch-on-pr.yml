name: Run difficulty patch on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-unlimited-difficulty-display
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute embedded patch
        shell: python
        run: |
          from pathlib import Path
          workflow=Path('.github/workflows/patch-difficulty-display.yml').read_text(encoding='utf-8')
          start_marker='      - name: Apply difficulty display and release patch\n        shell: python\n        run: |\n'
          end_marker='      - name: Commit patch\n'
          start=workflow.index(start_marker)+len(start_marker)
          end=workflow.index(end_marker,start)
          lines=[]
          for line in workflow[start:end].splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          exec(compile(script,'difficulty-release-patch.py','exec'),{'__name__':'__main__'})
      - name: Commit generated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: show unlimited authored and automatic difficulty"
          git push origin HEAD:agent/fix-unlimited-difficulty-display
