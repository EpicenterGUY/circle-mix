name: Apply all-platform release

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-release-metadata:
    if: ${{ github.head_ref == 'release/all-platforms-0.9.46' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-platforms-0.9.46
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply aligned Windows, Android, and PWA release metadata
        run: python scripts/apply-all-platforms-release.py
      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata and repository behavior
        shell: bash
        run: |
          set -o pipefail
          npm test
          npm run desktop:check
          git diff --check
      - name: Commit clean all-platform release
        shell: bash
        run: |
          rm scripts/apply-all-platforms-release.py
          rm .github/workflows/apply-all-platforms-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: align Windows Android and PWA versions"
          git push origin HEAD:release/all-platforms-0.9.46
