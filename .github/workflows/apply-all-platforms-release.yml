name: Apply all-platform release

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-release-metadata:
    if: ${{ github.head_ref == 'release/all-platforms-0.9.46' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-platforms-0.9.46
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply aligned Windows, Android, and PWA release metadata
        run: |
          python scripts/apply-all-platforms-release.py
          python scripts/fix-all-platform-release-tests.py
      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata and repository behavior
        shell: bash
        run: |
          mkdir -p artifacts/all-platform-release
          if ! npm test > artifacts/all-platform-release/npm-test.log 2>&1; then
            tail -n 180 artifacts/all-platform-release/npm-test.log
            exit 1
          fi
          if ! npm run desktop:check > artifacts/all-platform-release/desktop-check.log 2>&1; then
            tail -n 180 artifacts/all-platform-release/desktop-check.log
            exit 1
          fi
          git diff --check 2>&1 | tee artifacts/all-platform-release/git-diff-check.log
      - name: Upload release preparation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-platform-release-diagnostics-${{ github.run_attempt }}
          path: artifacts/all-platform-release/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit clean all-platform release
        shell: bash
        run: |
          rm scripts/apply-all-platforms-release.py
          rm scripts/fix-all-platform-release-tests.py
          rm .github/workflows/apply-all-platforms-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: align Windows Android and PWA versions"
          git push origin HEAD:release/all-platforms-0.9.46
