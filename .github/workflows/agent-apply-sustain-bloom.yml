name: Apply sustain completion bloom

on:
  push:
    branches:
      - agent/sustain-completion-bloom

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          game = 'src/game.js'
          replace_one(
              game,
              '  function playHitSound(type="cut", quality="PERFECT"){',
              '  function playHitSound(type="cut", quality="PERFECT", options={}){',
              'hit sound options signature'
          )
          replace_one(
              game,
              '    const family=type==="pulse"?"pulse":type.startsWith("trace")?"trace":type.startsWith("slide")?"slide":type.startsWith("swing")?"swing":type==="fx"?"hold":type.startsWith("scratch")?"scratch":"cut";\n    const direction=type.endsWith("CCW")?-1:(type.endsWith("CW")?1:0);',
              '    const family=type==="pulse"?"pulse":type.startsWith("trace")?"trace":type.startsWith("slide")?"slide":type.startsWith("swing")?"swing":type==="fx"?"hold":type.startsWith("scratch")?"scratch":"cut";\n    const completion=options.completion===true;\n    const direction=type.endsWith("CCW")?-1:(type.endsWith("CW")?1:0);',
              'completion sound flag'
          )
          replace_one(
              game,
              '    if(quality==="PERFECT"){\n      const sparkFrom=family==="pulse"?1320:(family==="hold"?980:1880);',
              '''    if(completion&&family==="hold"){
      tone({wave:"triangle",from:520,to:910,duration:.078,volume:.030,delay:.014,attack:.006});
      noise({duration:.036,volume:.026,delay:.010,type:"highpass",frequency:1650,q:.8});
    }else if(completion&&family==="slide"){
      tone({wave:"sine",from:direction<0?1420:920,to:direction<0?940:1480,duration:.082,volume:.032,delay:.012,attack:.006});
      tone({wave:"triangle",from:1820,to:2240,duration:.050,volume:.018,delay:.032,attack:.004});
    }else if(completion&&family==="trace"){
      tone({wave:"sine",from:1480,to:2280,duration:.110,volume:.030,delay:.010,attack:.008});
      tone({wave:"triangle",from:2320,to:1760,duration:.086,volume:.020,delay:.028,attack:.006});
    }

    if(quality==="PERFECT"){
      const sparkFrom=family==="pulse"?1320:(family==="hold"?980:1880);''',
              'sustain completion sound layers'
          )
          replace_one(
              game,
              '  }\n\n  function judge(n,label,color,event={}){',
              '''  }

  function sustainCompletionFamily(type=""){
    if(type==="fx")return "hold";
    if(type.startsWith("slide"))return "slide";
    if(type.startsWith("trace"))return "trace";
    return null;
  }

  function sustainCompletionAngle(n){
    if(n.type?.startsWith("trace"))return resolveTraceMotion(n).finalAngle;
    if(n.type?.startsWith("slide"))return n.endAngle ?? n.visualEndAngle ?? (n.angle+slideDelta(n));
    return n.angle;
  }

  function addSustainCompletionEffect(n,label,color){
    const family=sustainCompletionFamily(n.type);
    if(!family)return;
    const a=sustainCompletionAngle(n);
    const p={x:cx+Math.cos(a)*hitR,y:cy+Math.sin(a)*hitR};
    const petalCount=family==="hold"?6:(family==="slide"?8:10);
    const petalRadius=label==="PERFECT"?14:10;
    for(let i=0;i<petalCount;i++){
      const petalAngle=a+i*TAU/petalCount;
      addParticles(p.x+Math.cos(petalAngle)*petalRadius,p.y+Math.sin(petalAngle)*petalRadius,color,1,label==="PERFECT"?.48:.34);
    }
    if(label==="PERFECT"){addWave(a-.04,color);addWave(a+.04,color);}
    if(family==="trace")addRingBurst(color,label==="PERFECT"?.48:.38,"TRACE END");
    const text=family==="hold"?"HOLD END":(family==="slide"?"SLIDE END":"TRACE END");
    addFeedback(text,p.x,p.y+20,color);
  }

  function judge(n,label,color,event={}){''',
              'sustain completion effect helpers'
          )
          replace_one(
              game,
              '    n.done=true;\n    playHitSound(n.type,label);',
              '    n.done=true;\n    const sustainFamily=sustainCompletionFamily(n.type);\n    playHitSound(n.type,label,{completion:!!sustainFamily});',
              'route completion sound'
          )
          replace_one(
              game,
              '''    let a=n.angle;
    if(n.type.startsWith("slide") || n.type.startsWith("scratch")){
      a = n.endAngle ?? n.visualEndAngle ?? a;
    }''',
              '''    let a=n.angle;
    if(n.type.startsWith("slide") || n.type.startsWith("scratch")){
      a = n.endAngle ?? n.visualEndAngle ?? (n.angle+slideDelta(n));
    }else if(n.type.startsWith("trace")){
      a = resolveTraceMotion(n).finalAngle;
    }''',
              'trace endpoint judgement effect'
          )
          replace_one(
              game,
              '    addWave((isScratch||isSwing)?a:a,color);',
              '    addWave((isScratch||isSwing)?a:a,color);\n    if(sustainFamily)addSustainCompletionEffect(n,label,color);',
              'invoke sustain completion effect'
          )
          replace_one(
              game,
              'n.completionTime=Number.isFinite(n.endpointCapturedAt)?n.endpointCapturedAt:t; addWave(motion.finalAngle,COLORS.trace); addRingBurst(COLORS.trace,.42,"END"); judge(',
              'n.completionTime=Number.isFinite(n.endpointCapturedAt)?n.endpointCapturedAt:t; judge(',
              'centralize trace endpoint effect'
          )

          feasibility = Path('src/chart-feasibility.js')
          text = feasibility.read_text(encoding='utf-8')
          text = text.replace("const VERSION='feasibility-v1';", "const VERSION='feasibility-v2';", 1)
          text = text.replace(
              '    simultaneousWindowSeconds:.018,\n    sameAngleToleranceDeg:12,',
              '    simultaneousWindowSeconds:.018,\n    handoffWindowSeconds:.036,\n    handoffAngleToleranceDeg:14,\n    sameAngleToleranceDeg:12,',
              1
          )
          old = '''      const anchorTime=['hold','slide','trace'].includes(previous.type)?previous.endTime:previous.time;
      const anchorAngle=['hold','slide','trace'].includes(previous.type)?previous.endAngle:previous.angle;
      const gap=next.time-anchorTime;
      if(gap<=.001)continue;
      const travel=angleDistance(anchorAngle,next.angle),rate=travel/gap;
      let severity=null;
      if((gap<=.055&&travel>=100)||rate>=settings.travelRedDegPerSecond)severity='red';
      else if((gap<=.09&&travel>=100)||rate>=settings.travelOrangeDegPerSecond)severity='orange';
      else if((gap<=.13&&travel>=120)||rate>=settings.travelYellowDegPerSecond)severity='yellow';
      if(severity)add(severity,'AIM_TRAVEL',`${Math.round(travel)}° 에임 이동을 ${(gap*1000).toFixed(0)}ms 안에 요구합니다.`,[previous,next],{travelDeg:Number(travel.toFixed(1)),gapSeconds:Number(gap.toFixed(4)),rateDegPerSecond:Math.round(rate)});'''
          new = '''      const previousSustained=['hold','slide','trace'].includes(previous.type);
      const anchorTime=previousSustained?previous.endTime:previous.time;
      const anchorAngle=previousSustained?previous.endAngle:previous.angle;
      const gap=next.time-anchorTime;
      const travel=angleDistance(anchorAngle,next.angle);
      const isHandoff=previousSustained&&Math.abs(gap)<=settings.handoffWindowSeconds;
      if(isHandoff){
        if(travel<=settings.handoffAngleToleranceDeg)continue;
        const severity=travel>=settings.overlapAngleRedDeg?'red':(travel>=settings.overlapAngleOrangeDeg?'orange':'yellow');
        add(severity,'SUSTAINED_HANDOFF_AIM',`${previous.type.toUpperCase()} 종료 직후 ${Math.round(travel)}° 떨어진 위치에서 다음 노트가 시작합니다.`,[previous,next],{travelDeg:Number(travel.toFixed(1)),gapSeconds:Number(gap.toFixed(4)),handoffWindowSeconds:settings.handoffWindowSeconds});
        continue;
      }
      if(gap<=.001)continue;
      const rate=travel/gap;
      let severity=null;
      if((gap<=.055&&travel>=100)||rate>=settings.travelRedDegPerSecond)severity='red';
      else if((gap<=.09&&travel>=100)||rate>=settings.travelOrangeDegPerSecond)severity='orange';
      else if((gap<=.13&&travel>=120)||rate>=settings.travelYellowDegPerSecond)severity='yellow';
      if(severity)add(severity,'AIM_TRAVEL',`${Math.round(travel)}° 에임 이동을 ${(gap*1000).toFixed(0)}ms 안에 요구합니다.`,[previous,next],{travelDeg:Number(travel.toFixed(1)),gapSeconds:Number(gap.toFixed(4)),rateDegPerSecond:Math.round(rate)});'''
          if text.count(old) != 1:
              raise SystemExit(f'handoff analyzer block: expected one match, found {text.count(old)}')
          feasibility.write_text(text.replace(old, new, 1), encoding='utf-8')

          hit_test = Path('tests/hit-sound.test.js')
          text = hit_test.read_text(encoding='utf-8')
          text = text.replace(
              "assert.match(game, /playHitSound\\(n\\.type,label\\);/, 'judgement must route the note type and quality into the sound engine');",
              """assert.match(sound, /const completion=options\\.completion===true/, 'sustain completion must be an explicit sound phase');
assert.match(sound, /completion&&family===\"hold\"[\\s\\S]*from:520,to:910/, 'HOLD must release with a light endpoint lift');
assert.match(sound, /completion&&family===\"slide\"[\\s\\S]*from:1820,to:2240/, 'SLIDE must land with a directional endpoint snap');
assert.match(sound, /completion&&family===\"trace\"[\\s\\S]*from:1480,to:2280/, 'TRACE must resolve with a clear endpoint shimmer');
assert.match(game, /playHitSound\\(n\\.type,label,\\{completion:!!sustainFamily\\}\\);/, 'judgement must mark sustained note sounds as completion cues');
assert.match(game, /function addSustainCompletionEffect\\(n,label,color\\)/, 'sustained notes need a dedicated endpoint visual effect');
assert.match(game, /HOLD END[\\s\\S]*SLIDE END[\\s\\S]*TRACE END/, 'each sustained family needs an endpoint label');
assert.match(game, /else if\\(n\\.type\\.startsWith\\(\"trace\"\\)\\)[\\s\\S]*resolveTraceMotion\\(n\\)\\.finalAngle/, 'TRACE feedback must appear at the authored endpoint');""",
              1
          )
          hit_test.write_text(text, encoding='utf-8')

          feasibility_test = Path('tests/chart-feasibility.test.js')
          text = feasibility_test.read_text(encoding='utf-8')
          marker = """{
  const result=analyzer.analyze(chart([{type:'cut',beat:0,angle:0},{type:'cut',beat:.16,angle:100},{type:'cut',beat:.32,angle:0}],120));
  assert.ok(['orange','red'].includes(result.issues.find(x=>x.code==='RAPID_REVERSAL')?.severity));
}
"""
          addition = marker + """{
  const result=analyzer.analyze(chart([{type:'fx',beat:0,angle:45,durationBeat:2},{type:'slideCW',beat:2,angle:45,durationBeat:1,sweepAngle:90}],120));
  assert.equal(codes(result).includes('SUSTAINED_HANDOFF_AIM'),false,'same-angle HOLD to SLIDE handoff is a valid BLOOM connection');
  assert.equal(result.summary.red,0);
}
{
  const result=analyzer.analyze(chart([{type:'fx',beat:0,angle:0,durationBeat:2},{type:'slideCW',beat:2,angle:120,durationBeat:1,sweepAngle:90}],120));
  assert.equal(result.issues.find(x=>x.code==='SUSTAINED_HANDOFF_AIM')?.severity,'red','off-angle zero-gap handoffs must remain physically invalid');
}
"""
          if text.count(marker) != 1:
              raise SystemExit(f'feasibility test marker: expected one match, found {text.count(marker)}')
          feasibility_test.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          Path('.github/workflows/agent-apply-sustain-bloom.yml').unlink()
          PY
      - name: Validate focused feature
        run: npm test
      - name: Commit generated feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/chart-feasibility.js tests/hit-sound.test.js tests/chart-feasibility.test.js .github/workflows/agent-apply-sustain-bloom.yml
          git commit -m "feat: add sustain completion bloom feedback"
          git push origin HEAD:agent/sustain-completion-bloom
