name: Apply sustain completion bloom

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/sustain-completion-bloom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sustain-completion-bloom
          fetch-depth: 0
      - name: Recover and run focused transform
        shell: bash
        run: |
          git show b51717f6b5eb9c33287c9052f3aa45cda98cf5b9:.github/workflows/agent-apply-sustain-bloom.yml \
            | sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply-sustain-bloom.py
          test -s /tmp/apply-sustain-bloom.py
          python3 /tmp/apply-sustain-bloom.py
      - name: Validate focused feature
        run: npm test
      - name: Commit generated feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add sustain completion bloom feedback"
          git push origin HEAD:agent/sustain-completion-bloom
