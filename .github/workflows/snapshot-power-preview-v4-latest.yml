name: Snapshot latest power preview implementation

on:
  push:
    branches:
      - feature/power-preview
    paths:
      - .github/workflows/snapshot-power-preview-v4-latest.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: 310c5d8912c0453fb219644e78650939a60ec9d1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-preview
      - name: Capture target run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/implement-power-preview-v4.yml/runs?branch=feature%2Fpower-preview&per_page=30")
            run=$(echo "$runs" | jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha)] | first // {}')
            run_id=$(echo "$run" | jq -r '.id // empty')
            status=$(echo "$run" | jq -r '.status // empty')
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then break; fi
            sleep 10
          done
          echo "$run" | jq . > .github/diagnostics/power-preview-v4-target-run.json
          if [ -n "$run_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > .github/diagnostics/power-preview-v4-target-jobs.json
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/diagnostics/power-preview-v4-target-*.json
          git commit -m "chore: snapshot direct POWER preview fixture run"
          git push origin HEAD:feature/power-preview
