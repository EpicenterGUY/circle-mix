name: CI Safety Net

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-editor-playtest-record-guard:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/editor-playtest-controls' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editor-playtest-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply record isolation
        run: python scripts/apply-editor-playtest-record-guard.py
      - name: Install dependencies
        run: npm ci
      - name: Verify record isolation
        run: |
          npm test
          git diff --check
      - name: Commit clean record guard
        shell: bash
        run: |
          rm scripts/apply-editor-playtest-record-guard.py
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate editor playtest records"
          git push origin HEAD:agent/editor-playtest-controls

  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax, smoke, repository, and release metadata checks
        shell: bash
        run: |
          mkdir -p artifacts/syntax-and-smoke
          set -o pipefail
          npm test 2>&1 | tee artifacts/syntax-and-smoke/npm-test.log
          git diff --check 2>&1 | tee artifacts/syntax-and-smoke/git-diff-check.log
          node scripts/check-release-metadata.js 2>&1 | tee artifacts/syntax-and-smoke/release-metadata.log
      - name: Upload syntax and smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: syntax-and-smoke-diagnostics-${{ github.run_attempt }}
          path: artifacts/syntax-and-smoke
          if-no-files-found: warn
          retention-days: 14

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:browser
        env:
          BROWSER_ARTIFACTS_DIR: artifacts/browser-regression
      - name: Upload browser failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics-${{ github.run_attempt }}
          path: artifacts/browser-regression
          if-no-files-found: warn
          retention-days: 14
