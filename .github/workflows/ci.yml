name: CI Safety Net

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax, smoke, repository, and release metadata checks
        shell: bash
        run: |
          mkdir -p artifacts/syntax-and-smoke
          set -o pipefail
          npm test 2>&1 | tee artifacts/syntax-and-smoke/npm-test.log
          git diff --check 2>&1 | tee artifacts/syntax-and-smoke/git-diff-check.log
          node scripts/check-release-metadata.js 2>&1 | tee artifacts/syntax-and-smoke/release-metadata.log
      - name: Upload syntax and smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: syntax-and-smoke-diagnostics-${{ github.run_attempt }}
          path: artifacts/syntax-and-smoke
          if-no-files-found: warn
          retention-days: 14

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:browser
        env:
          BROWSER_ARTIFACTS_DIR: artifacts/browser-regression
      - name: Upload browser failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics-${{ github.run_attempt }}
          path: artifacts/browser-regression
          if-no-files-found: warn
          retention-days: 14

  apply-pulse-sync-render-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/pulse-sync-hold-swing-visibility' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused renderer patch
        run: python scripts/agent-pulse-sync-render-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused patch
        run: npm test
      - name: Commit clean renderer fix
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/agent-pulse-sync-render-fix.yml scripts/agent-pulse-sync-render-fix.py
          git config user.name "circle-mix-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make PULSE-synced HOLD and SWING visibly orange"
          git push origin HEAD:${{ github.head_ref }}
