name: PR 158 local difficulty anchor diagnostic

on:
  push:
    branches: [agent/editor-playtest-controls]
    paths: [.github/workflows/pr158-local-difficulty-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record patch anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'song-sort':('src/song-record.js','  function difficultySortValue(id,meta={},chart={}){'),
            'song-export':('src/song-record.js','numericDifficulty,difficultySortValue,sortLocalDifficultyOrder'),
            'game-hud':('src/game.js','if(isLocalSong(selectedSong)){ const c=selectedSong.charts?.[mode]; return c ? chartDifficulty.calculate(c) : null; }'),
            'game-select':('src/game.js','const chart=songData.charts?.[difficultyId]; let stars;'),
            'editor-export':('src/editor-playtest.js','previewMetrics,summary,mountBadge'),
            'editor-record':('src/editor.js','const diffKey=difficultyKey();'),
            'song-test':('tests/song-record.test.js',"assert.deepEqual(R.normalize({id:'numeric'"),
            'editor-test':('tests/editor-playtest.test.js','editor playtest is wired into editor')
          }
          lines=[]
          for name,(path,needle) in checks.items():
              text=Path(path).read_text(encoding='utf-8')
              lines.append(f'{name}: {needle in text} index={text.find(needle)}')
          Path('pr158-fix-anchor-report.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          cat pr158-fix-anchor-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr158-fix-anchor-report.txt
          git commit -m "chore: record PR 158 fix anchors" || true
          git push origin HEAD:agent/editor-playtest-controls
